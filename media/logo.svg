<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2EABD" />
      <stop offset="50%" stop-color="#84C385" />
      <stop offset="100%" stop-color="#A2D9A1" />
    </linearGradient>

    <!-- Inner Symbol Soft Gradient -->
    <linearGradient id="symbolGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D5F0D0" />
      <stop offset="60%" stop-color="#9AD398" />
      <stop offset="100%" stop-color="#7BBF7B" />
    </linearGradient>
  </defs>

  <!-- Dark Inner Circle -->
  <circle cx="250" cy="250" r="215" fill="#1A201C" />

  <!-- Outer Gradient Border -->
  <circle cx="250" cy="250" r="225" fill="none" stroke="url(#ringGradient)" stroke-width="20" />

  <!-- Top Dot / Head -->
  <circle cx="280" cy="95" r="36" fill="url(#symbolGradient)" />

  <!-- Main Abstract Silhouette -->
  <path d="
    M 100,360 
    C 80,360 80,335 100,335 
    L 200,335 
    C 230,335 240,310 245,290 
    L 130,290 
    C 115,290 115,270 130,270 
    L 252,270 
    C 255,250 255,240 250,230 
    L 160,230 
    C 145,230 145,210 160,210 
    L 240,210 
    C 230,195 210,185 190,185 
    C 175,185 175,165 190,165 
    L 310,165 
    C 360,165 375,210 330,290 
    L 300,335 
    L 390,335 
    C 410,335 410,360 390,360 
    Z" 
    fill="url(#symbolGradient)" 
    stroke="url(#symbolGradient)" 
    stroke-width="12" 
    stroke-linejoin="round" 
    stroke-linecap="round" 
  />
</svg>
